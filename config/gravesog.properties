# Graves OG settings. Restart the game or server to apply.

# Only the grave's owner can open it (operators in creative mode can open any grave).
# Set to false to let anyone open any grave, for example on a co-op world.
ownerOnly=true
# With ownerOnly=true: minutes after the death when anyone may open the grave. 0 = never.
# Counted while the world is running (20 ticks = 1 second), like the day and night cycle.
unlockMinutes=0

# How much of the player's experience the grave keeps, in percent (0-100). The rest is lost.
experiencePercent=100

# After respawning, the player gets a compass that points to their grave. It disappears when the grave is opened.
graveCompass=true
# Tell the player in chat where their grave is when they die.
chatMessage=true

# Client side: looking at a grave shows how its owner died, what it holds and who can open it.
deathInfo=true
